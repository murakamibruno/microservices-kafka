server:
  port: 3000

spring:

  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:9092}
    topic:
      start-saga: start-saga
      notify-ending: notify-ending
    consumer:
      group-id: order-group
      auto-offset-reset: latest

  data:
    mongodb:
      database: admin
      uri: ${MONGO_DB_URI:mongodb://admin:123456@localhost:27017/?directConnection=true&authSource=admin}
      auto-index-creation: true

outbox:
  source: ORDER_SERVICE
  relay:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    send-timeout-ms: ${OUTBOX_SEND_TIMEOUT_MS:5000}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}
    base-backoff-ms: 1000
    max-backoff-ms: 60000
    lease-ms: ${OUTBOX_LEASE_MS:30000}
  cleanup:
    cron: ${OUTBOX_CLEANUP_CRON:0 0 * * * *}
    retention-hours: ${OUTBOX_RETENTION_HOURS:72}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

logging:
  level:
    org:
      apache:
        kafka: OFF